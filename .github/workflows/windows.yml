name: Windows checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows / ${{ matrix.shell }}
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.14.0'
          package-manager-cache: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.3'
          enable-cache: false
      - name: Install locked local runtime
        run: |
          & ./scripts/install.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Installation failed' }
      - name: Run noninteractive contracts and resource measurement
        run: |
          & ./tests/ci.ps1 -FreshInstall
          if ($LASTEXITCODE -ne 0) { throw 'Windows checks failed' }
      - name: Upload this run's results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-results-${{ matrix.shell }}
          path: |
            tests/.work/ci/summary.json
            tests/.work/ci/*.log
            tests/.work/ci/resource-usage.json
            tests/.work/ci/clean-install.json
          if-no-files-found: warn
          retention-days: 7
